name: Release

# Builds the city3dstac binaries and creates the GitHub Release for the tag
# produced by publish.yml. Runs automatically once "Publish to crates.io"
# completes successfully; can also be run manually for an existing tag.
#
# Note: `workflow_run` only fires for workflow files on the default branch.
on:
  workflow_run:
    workflows: ["Publish to crates.io"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.4.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Work out which tag to release.
  resolve:
    name: Resolve release tag
    # `workflow_run` matches on workflow name only, so also require that the
    # triggering run was a manual dispatch in this repository (not, e.g., a
    # same-named workflow from a fork PR) before trusting its artifact.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Download release tag from publish run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-tag
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            TAG=$(tr -d '[:space:]' < release-tag.txt)
          else
            TAG="${INPUT_TAG}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '${TAG}'"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist in ${GITHUB_REPOSITORY}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

  # Build release binaries for all platforms at the tag.
  build-release:
    name: Build Release (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: city3dstac
            asset_name: city3dstac-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: city3dstac
            asset_name: city3dstac-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: city3dstac
            asset_name: city3dstac-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: city3dstac
            asset_name: city3dstac-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: city3dstac.exe
            asset_name: city3dstac-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  # Create the GitHub Release once all binaries are built.
  create-release:
    name: Create GitHub Release
    needs: [resolve, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: city3dstac-*

      - name: Create checksums
        run: |
          set -euo pipefail
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              [ -f "$file" ] && sha256sum "$file" >> checksums.txt
            done
          done
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.version, 'alpha') || contains(needs.resolve.outputs.version, 'beta') || contains(needs.resolve.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/city3dstac-linux-amd64/*
            artifacts/city3dstac-linux-arm64/*
            artifacts/city3dstac-macos-amd64/*
            artifacts/city3dstac-macos-arm64/*
            artifacts/city3dstac-windows-amd64.exe/*
            artifacts/checksums.txt
